<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy - Unit Tests</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            min-height: 100vh;
        }

        .test-container {
            max-width: 1000px;
            margin: 0 auto;
            background: #252526;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .test-header {
            margin-bottom: 30px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 20px;
        }

        .test-header h1 {
            color: #667eea;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .test-header p {
            color: #999;
            font-size: 0.95rem;
        }

        .test-content {
            margin-bottom: 30px;
        }

        .test-section {
            margin-bottom: 25px;
            background: #1e1e1e;
            padding: 20px;
            border-left: 4px solid #667eea;
            border-radius: 4px;
        }

        .test-section h2 {
            color: #667eea;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .test-line {
            padding: 8px 0;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .test-pass {
            color: #4ec9b0;
        }

        .test-fail {
            color: #f48771;
        }

        .test-info {
            color: #9cdcfe;
        }

        .test-warning {
            color: #ce9178;
        }

        .test-summary {
            background: linear-gradient(135deg, #1e1e1e 0%, #252526 100%);
            padding: 20px;
            border-radius: 8px;
            margin-top: 30px;
            border: 2px solid #667eea;
        }

        .test-summary h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .summary-stat {
            display: inline-block;
            margin-right: 30px;
            margin-bottom: 10px;
        }

        .summary-stat-label {
            color: #999;
            font-size: 0.85rem;
        }

        .summary-stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
        }

        .summary-stat-value.pass {
            color: #4ec9b0;
        }

        .summary-stat-value.fail {
            color: #f48771;
        }

        .test-actions {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn-secondary {
            background: #2d2d30;
            color: #d4d4d4;
            border: 2px solid #667eea;
        }

        .btn-secondary:hover {
            background: #3e3e42;
        }

        .btn-danger {
            background: #f48771;
            color: white;
        }

        .btn-danger:hover {
            background: #d65a54;
            transform: translateY(-2px);
        }

        .test-output {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #3e3e42;
        }

        @media (max-width: 768px) {
            .test-container {
                padding: 20px;
            }

            .test-header h1 {
                font-size: 1.4rem;
            }

            .summary-stat {
                display: block;
                margin-bottom: 15px;
            }

            .test-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="test-container">
        <div class="test-header">
            <h1>🔒 Privacy Policy (DL-60) - Unit Test Suite</h1>
            <p>Comprehensive unit tests for Privacy Policy page functionality</p>
        </div>

        <div class="test-content" id="testContent">
            <div class="test-section">
                <h2>Running Tests...</h2>
                <div class="test-line test-info">
                    Loading test suite and executing tests. Please wait...
                </div>
            </div>
        </div>

        <div class="test-summary" id="testSummary" style="display: none;">
            <h3>📊 Test Summary</h3>
            <div>
                <div class="summary-stat">
                    <div class="summary-stat-label">Total Tests</div>
                    <div class="summary-stat-value" id="totalTests">0</div>
                </div>
                <div class="summary-stat">
                    <div class="summary-stat-label">Passed</div>
                    <div class="summary-stat-value pass" id="passedTests">0</div>
                </div>
                <div class="summary-stat">
                    <div class="summary-stat-label">Failed</div>
                    <div class="summary-stat-value fail" id="failedTests">0</div>
                </div>
                <div class="summary-stat">
                    <div class="summary-stat-label">Success Rate</div>
                    <div class="summary-stat-value" id="successRate">0%</div>
                </div>
            </div>
        </div>

        <div class="test-actions">
            <button class="btn btn-primary" onclick="runTests()">▶ Run Tests</button>
            <button class="btn btn-secondary" onclick="clearLocalStorage()">Clear localStorage</button>
            <button class="btn btn-danger" onclick="clearTestOutput()">Clear Output</button>
        </div>

        <div class="test-output" id="testOutput"></div>
    </div>

    <script src="test_privacy_policy.js"></script>
    <script>
        /**
         * Run all Privacy Policy tests
         */
        function runTests() {
            const output = document.getElementById('testOutput');
            output.innerHTML = '';

            addOutput('=== Privacy Policy (DL-60) Unit Tests ===\n', 'info');
            addOutput('Starting test suite execution...\n', 'info');

            const result = PrivacyPolicyTests.run();

            // Display results
            result.results.split('\n').forEach(line => {
                if (line.includes('✓')) {
                    addOutput(line, 'pass');
                } else if (line.includes('✗')) {
                    addOutput(line, 'fail');
                } else if (line.includes('===')) {
                    addOutput(line, 'warning');
                } else if (line.includes('INFO:')) {
                    addOutput(line, 'info');
                } else {
                    addOutput(line, 'default');
                }
            });

            // Update summary
            updateSummary(result);
        }

        /**
         * Add a line to test output
         */
        function addOutput(text, type) {
            const output = document.getElementById('testOutput');
            const line = document.createElement('div');
            line.className = `test-line test-${type}`;
            line.textContent = text;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }

        /**
         * Update test summary
         */
        function updateSummary(result) {
            document.getElementById('testSummary').style.display = 'block';
            document.getElementById('totalTests').textContent = result.total;
            document.getElementById('passedTests').textContent = result.passed;
            document.getElementById('failedTests').textContent = result.failed;
            document.getElementById('successRate').textContent = ((result.passed / result.total) * 100).toFixed(2) + '%';
        }

        /**
         * Clear localStorage
         */
        function clearLocalStorage() {
            if (confirm('Clear localStorage? This will remove all stored data.')) {
                localStorage.removeItem('privacyPolicyConsent');
                localStorage.removeItem('privacyPolicyTimestamp');
                addOutput('\n✓ localStorage cleared successfully', 'pass');
                addOutput('Removed keys: privacyPolicyConsent, privacyPolicyTimestamp\n', 'info');
            }
        }

        /**
         * Clear test output
         */
        function clearTestOutput() {
            document.getElementById('testOutput').innerHTML = '';
            document.getElementById('testSummary').style.display = 'none';
        }

        /**
         * Run tests on page load
         */
        window.addEventListener('load', () => {
            runTests();
        });
    </script>
</body>

</html>
